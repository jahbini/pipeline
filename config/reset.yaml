# =====================================================================
#   reset.yaml  —  the canonical bootstrap / reset recipe (was base_ite)
# =====================================================================
#
#   The authoritative base/bootstrap chain for @jahbini/pipeline. Four
#   steps, run inside a pipe's CWD (pipes/<pipe>/):
#
#     1. reset_base_environment_ite — wipe stale training/out artifacts
#        and fire the sqliteResetAll request key so runtime.sqlite is
#        truncated on the next meta touch.
#     2. download_model — canonical git+git-lfs HuggingFace downloader
#        (scripts/model/download_model.coffee, 188-line hardened path).
#        NEVER the HF CLI, NEVER Python.
#     3. quantize_model — MLX 4-bit convert. Idempotent on re-run.
#     4. seed_story_sqlite — ingest markdown stories from data/*.md into
#        the sqlite stories table.
#
#   After a green run, the pipe has:
#     - build/model/          (raw HF download; can be rm -rf'd)
#     - build/model4/         (self-contained quantized MLX; downstream
#                              recipes reference this)
#     - runtime.sqlite:stories populated + zero KAG rows (oracle will
#                              start over on next oracle_ite run)
#
#   Project overrides:
#     - Change `stories_md.source` if your markdown lives elsewhere.
#     - Change `run.model` if you're bootstrapping a different HF repo.
#     - Set `download_model.download_dir` / `quantize_model.src_dir` /
#       `quantized_dir` to move the on-disk layout.
#
#   No other recipe `include:`s base_ite, so these steps don't bleed
#   into diary_ite / oracle_ite / lora_ite / eval_ite runs.
#
run:
  # `run.model` intentionally not set here — the model identity is a
  # pipe fact, not a recipe fact. Each pipe's override.yaml must set
  # it. See GPT/model_identity.md.
  output_dir: out
  data_dir: data
  training_dir: build/train
  loraLand: ${MODELS}/${run.model}
  debug_s: false
  debug_mlx: false
  debug_sql: false

artifacts:
  stories_md:
    source: data/stories.md
  story_seed_ids:
    target: out/story_seed_ids.json

reset_base_environment_ite:
  run: base_ite/reset_base_environment_ite.coffee
  depends_on: []
  needs: []
  makes: []
  # 2026-09-13: checkbox controls for the human running reset from
  # the writer UI. All default false — a bare-click reset only
  # wipes transient out/*.json (safe on any pipe). Tick the
  # relevant force flag to escalate:
  #   force_lora_reset   → wipe adapter + clear lora_* sqlite
  #   force_oracle_reset → clear kag/embeddings/simplifications
  #   force_download     → wipe build/model[4], forces re-download
  #   force_full_reset   → nuke everything (pre-2026-09-11 behavior)
  force_lora_reset:   [ UI_checkbox, false ]
  force_oracle_reset: [ UI_checkbox, false ]
  force_download:     [ UI_checkbox, false ]
  force_full_reset:   [ UI_checkbox, false ]

download_model:
  run: model/download_model.coffee
  depends_on: [reset_base_environment_ite]
  needs: []
  makes: []
  download_dir: ${MODELS}/${run.model}

quantize_model:
  # Runs LAST — after seed_story_sqlite — so a Metal SIGABRT here
  # can only take itself down; download and seed are already safely
  # persisted.
  run: model/quantize_model.coffee
  depends_on: [download_model, seed_story_sqlite]
  needs: []
  makes: []
  src_dir:       ${MODELS}/${run.model}
  quantized_dir: ${MODELS}/${run.model}-mlx4
  q_bits: 4

seed_story_sqlite:
  # Seed runs AFTER download_model but BEFORE quantize_model. Rationale:
  #   - Making it depend on quantize meant a Metal SIGABRT during
  #     quantize killed the runner before seed ran.
  #   - Making it depend only on reset_base meant it ran IN PARALLEL
  #     with quantize — same SIGABRT killed both. pipeline_runner
  #     doesn't recover cleanly from Metal-abort.
  #   - Serialized between download and quantize: seed finishes in
  #     seconds against the just-landed data/, and a later quantize
  #     crash leaves the stories intact.
  run: kag_oracle_ite/seed_story_sqlite.coffee
  depends_on: [download_model]
  needs: [stories_md]
  makes: [story_seed_ids]
