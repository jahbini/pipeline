# =====================================================================
#   train_lora.yaml  —  LoRA adapter training (sibling of train_llm)
# =====================================================================
#   Trains ONE adapter over the selected stories, then records the run:
#   select -> build dataset -> train -> record. Defaults below are the
#   full-corpus sweet-spot (batch_size 200 grabs all ~169 stories in a
#   single selection — one full-corpus train, NOT a cumulative resuming
#   sweep, which over-trained). Generate diary entries afterward with the
#   `diary_ite` recipe (it reads build/adapter).
#
#   Sweet-spot config: rank 8 / alpha 16 (scale 2.0) / dropout 0.05 /
#   top-8 blocks / natural-EOS rows / maxSeqLength 640.
#
#   INCREMENTAL mode: lower select_lora_stories_ite.batch_size (e.g. 4)
#   in a pipe override to train in resuming batches instead of all-at-once.
#
#   ITERS TUNING: 300 is a starting point for the full corpus (~900 rows).
#   Judge from the diary entries:
#     - too much repetition / looping  -> LOWER  run_lora_train_ite.llm.iters
#     - weak / generic voice           -> RAISE it
#
#   FLOW: reset (bootstrap+prep)  ->  train_lora (this: train)  ->
#         diary_ite (generate + view entries against the trained adapter).

run:
  # `run.model` intentionally not set here — the model identity is a
  # pipe fact, not a recipe fact. Each pipe's override.yaml must set
  # it. See GPT/model_identity.md.
  output_dir: out
  data_dir: data
  training_dir: build/train
  loraLand: ${MODELS}/${run.model}
  debug_s: false
  debug_mlx: false
  debug_sql: false

artifacts:
  lora_cycle_state:
    target: out/lora_cycle_state.json
  lora_remaining_count:
    target: out/lora_remaining_count.json
  selected_story_ids:
    target: out/selected_story_ids.json
  train_rows:
    target: build/train/train.jsonl
  valid_rows:
    target: build/train/valid.jsonl
  test_rows:
    target: build/train/test.jsonl
  lora_stdout:
    target: out/lora_train.txt
  lora_run_record:
    target: out/lora_run_record.json
  trained_story_ids:
    target: out/trained_story_ids.json

select_lora_stories_ite:
  run: lora_ite/select_lora_stories_ite.coffee
  depends_on: []
  needs: []
  makes: [lora_cycle_state, lora_remaining_count, selected_story_ids]
  # All stories in one selection (169 available). Single full-corpus train.
  batch_size: 200

build_lora_dataset_ite:
  run: lora_ite/build_lora_dataset_ite.coffee
  depends_on: [select_lora_stories_ite]
  needs: [selected_story_ids]
  makes: [train_rows, valid_rows, test_rows]
  # Natural-EOS rows that fit under maxSeqLength (no truncation).
  max_total_tokens: 400

run_lora_train_ite:
  run: lora_ite/run_lora_train_ite.coffee
  depends_on: [build_lora_dataset_ite]
  needs: [lora_cycle_state, selected_story_ids, train_rows, valid_rows, test_rows]
  makes: [lora_stdout, lora_run_record]
  test_only: false
  quantized_model_dir: ${MODELS}/${run.model}-mlx4
  adapter_path: build/adapter
  resume_adapter_file: build/adapter/adapters.safetensors
  llm:
    batchSize: 1
    iters: 300
    maxSeqLength: 640
    learningRate: 0.00001
    loraRank: 8
    loraAlpha: 16
    loraDropout: 0.05
    loraLayers: 8
    stepsPerReport: 10
    saveEvery: 100

record_lora_training_ite:
  run: lora_ite/record_lora_training_ite.coffee
  depends_on: [run_lora_train_ite]
  needs: [lora_run_record]
  makes: [trained_story_ids]
