# =====================================================================
#   storacle.yaml  —  prompt-exploration harness for the KAG oracle
# =====================================================================
#   Sibling of chat_llm: one LLM call, one story, one output. The
#   prompt is a UI textarea that MUST contain the placeholder
#   `{{{STORY}}}` — the step substitutes the chosen story's text
#   into that slot before calling the model.
#
#   Purpose: hand-explore prompts for the current model (abliterated
#   Huihui / whatever) without the ceremony of a full oracle_ite run.
#   Iterate on prompt shape until the model produces what you want,
#   THEN port the successful prompt into oracle_ite.yaml.
#
#   To run:
#     - Ensure pipes/<pipe>/build/model4/ has a quantized model and
#       pipes/<pipe>/runtime.sqlite has the stories table populated.
#     - Select this recipe from the UI dropdown.
#     - In the "story_id" dropdown, pick a Jim story.
#     - In the "prompt_text" textarea, write a prompt with {{{STORY}}}
#       somewhere in it.
#     - Kick the run; watch pipes/<pipe>/out/storacle.txt.

run:
  # `run.model` intentionally not set here — the model identity is a
  # pipe fact, not a recipe fact. Each pipe's override.yaml must set
  # it. See GPT/model_identity.md.
  output_dir: out
  data_dir: data
  loraLand: ${MODELS}/${run.model}
  debug_s: false
  debug_llm: false

artifacts:
  storacle_raw:
    target: out/storacle_raw.txt
  storacle_meta:
    target: out/storacle_meta.json
  storacle_text:
    target: out/storacle.txt

storacle:
  run: storacle/storacle.coffee
  depends_on: []
  needs: []
  makes: [storacle_raw, storacle_meta, storacle_text]
  quantized_model_dir: ${MODELS}/${run.model}-mlx4

  # Story picker — dropdown of every story in this pipe's sqlite.
  story_id: [ UI_dropdown, db/story_titles, "" ]

  # Prompt template. MUST contain at least one of these placeholders:
  #   {{{STORY}}}          → substituted with the full raw story text
  #   {{{LEAD_FRAGMENT}}}  → substituted with the exact lead paragraphs
  #                           that build_lora_dataset_ite fed to LoRA
  #                           training for this story (first paragraph,
  #                           plus second if the first is <300 chars)
  # Both are resolved every run so you can mix them freely.
  prompt_text: [ UI_textarea, "" ]

  # Adapter picker — dropdown of adapters known to the writer's UI
  # (same source `prompt_llm` uses). Sentinel values that mean "no
  # adapter, base model only": empty string, "none", "base", "-".
  adapter_path: [ UI_dropdown, adapters, "" ]

  # Toggle: prepend a Related-Passages block retrieved via top-K
  # cosine over kag_embeddings_clean. RAG-lite.
  use_chunks: [ UI_checkbox, false ]

  # Toggle: prepend the chosen story's kag_entries as an inline
  # "Story-derived context" block (one line per keyword/headline).
  use_kag:    [ UI_checkbox, false ]

  # Top-K used when use_chunks=true.
  rag_top_k: 4

  llm:
    maxTokens: 400
    temperature: 0.2
    topP: 0.9
