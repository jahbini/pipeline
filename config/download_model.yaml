# =====================================================================
#   download_model.yaml — fetch + quantize a HuggingFace model
# =====================================================================
#
#   A two-step recipe that lands a self-contained quantized MLX
#   model in `build/`. The output requires no further network
#   access — load it from disk, run it offline.
#
#   Model paths
#   -----------
#   Uses the `${MODELS}` env var as the shared model cache root.
#   Set `MODELS=~/.cache/jahbini-pipeline` (or wherever you want the
#   cache) before invoking. The `${MODELS:-build}` form falls back
#   to `build/` for backward compatibility when MODELS is unset —
#   old behavior preserved.
#
#   How to use
#   ----------
#   From the project root, drop this in `override.yaml`:
#
#     pipeline: download_model
#     download_model:
#       model: Qwen/Qwen3-4B-Instruct-2507    # required: the HF repo
#
#   Then: `npx pipeline`. Two steps run in order:
#
#     1. `download_model`  →  ${MODELS}/model/   (raw HF download)
#     2. `quantize_model`  →  ${MODELS}/model4/  (4-bit MLX, ready to use)
#
#   After it finishes:
#     - ${MODELS}/model/   has the raw download (~16 GB for a 4B model).
#       You can `rm -rf` it afterward to reclaim disk; the
#       quantized dir is the only thing downstream recipes need.
#     - ${MODELS}/model4/  is the self-contained quantized MLX model.
#       Reference it from other recipes via the `quantized_dir`
#       param or by symlinking it where the recipe expects.
#
#   Override params
#   ----------------
#     model            required — HF repo path (org/name)
#     download_dir     default: ${MODELS:-build}/model
#     quantized_dir    default: ${MODELS:-build}/model4
#     q_bits           default: 4
#     skip_quantize    default: false  (true = download only)

run:
  output_dir: build

# This recipe writes its outputs to disk (${MODELS}/model/ and
# ${MODELS}/model4/) rather than through the Memo, so there are no
# declared artifacts. The chain is enforced via depends_on alone.
artifacts: {}

download_model:
  run: model/download_model.coffee
  depends_on: []
  needs: []
  makes: []
  download_dir: ${MODELS:-build}/model

quantize_model:
  run: model/quantize_model.coffee
  depends_on: [download_model]
  needs: []
  makes: []
  src_dir: ${MODELS:-build}/model
  quantized_dir: ${MODELS:-build}/model4
  q_bits: 4
