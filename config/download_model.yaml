# =====================================================================
#   download_model.yaml — fetch + quantize a HuggingFace model
# =====================================================================
#
#   A two-step recipe that lands a self-contained quantized MLX
#   model in `build/`. The output requires no further network
#   access — load it from disk, run it offline.
#
#   Model paths
#   -----------
#   When `MODELS` env var is set, the download + quantize scripts
#   auto-derive HF-cache-shaped paths from the `model` param:
#
#     $MODELS/hub/models--<org>--<name>/       (raw download)
#     $MODELS/mlx<bits>/<org>/<name>/          (quantized derivative)
#
#   This keeps multiple base models coexisting in one cache. When
#   MODELS is unset, falls back to the legacy `build/model`
#   layout below.
#
#   Explicit `download_dir` / `src_dir` / `quantized_dir` on the
#   step (or in a pipe override) wins over the derivation.
#
#   How to use
#   ----------
#   From the project root, drop this in `override.yaml`:
#
#     pipeline: download_model
#     download_model:
#       model: Qwen/Qwen3-4B-Instruct-2507    # required: the HF repo
#
#   Then: `npx pipeline`. Two steps run in order:
#
#     1. `download_model`  →  raw HF download
#     2. `quantize_model`  →  4-bit MLX, ready to use
#
#   After it finishes: the raw download is ~16 GB for a 4B model;
#   `rm -rf` it once quantize succeeds — the quantized dir is the
#   only thing downstream recipes need.
#
#   Override params
#   ----------------
#     model            required — HF repo path (org/name)
#     models_root      optional override for $MODELS
#     download_dir     explicit path; wins over derivation
#     src_dir          explicit path; wins over derivation
#     quantized_dir    explicit path; wins over derivation
#     q_bits           default: 4
#     skip_quantize    default: false  (true = download only)

run:
  output_dir: build

# This recipe writes its outputs to disk (either under $MODELS or
# the legacy build/ fallback — see "Model paths" above) rather than
# through the Memo, so there are no declared artifacts. The chain
# is enforced via depends_on alone.
artifacts: {}

# No explicit download_dir / src_dir / quantized_dir here: paths
# derive from `model` + $MODELS. Set them per-pipe only when you
# genuinely need to pin a non-cache location.
download_model:
  run: model/download_model.coffee
  depends_on: []
  needs: []
  makes: []

quantize_model:
  run: model/quantize_model.coffee
  depends_on: [download_model]
  needs: []
  makes: []
  q_bits: 4
