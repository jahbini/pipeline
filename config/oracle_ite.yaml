# =====================================================================
#   oracle_ite.yaml  —  iterative KAG-via-oracle ingestion pipeline
# =====================================================================
#   For each new story without KAG entries, prompts the oracle model
#   to extract emotional keywords + headlines and stores them as
#   queryable rows. Retries failed stories with backoff via the
#   `oracleFailureFor{...}` sqlite request key.

run:
  # Model paths are pipe-level facts. The pipe's override.yaml MUST
  # set run.loraLand (base) and run.quantized_dir (quantized). See
  # writer/MORNING.md — 2026-09-21 the recipe stops manufacturing
  # paths via ${MODELS}/${run.model}; step blocks below only *point
  # to* run.quantized_dir by name.
  output_dir: out
  data_dir: data
  training_dir: build/train

artifacts:
  new_story_ids:
    target: out/new_story_ids.json
  oracle_remaining_count:
    target: out/oracle_remaining_count.json
  kag_rejects:
    target: out/rejects.jsonl
  kag_viewed:
    target: out/viewed.jsonl

oracle_ask_sqlite:
  run: kag_oracle_ite/oracle_ask_sqlite.coffee
  depends_on: []
  needs: []
  makes: [new_story_ids, oracle_remaining_count, kag_rejects, kag_viewed]
  model_dir: ${run.quantized_dir}
  # Block scalar is `>` (folded). Tried `|` (literal) on 2026-08-06
  # thinking it'd help the model — the model got WORSE (bare keywords
  # only, no headlines, identical output every group). Folded works
  # with this parser + the abliterated model; do not switch again
  # without an A/B test on Huihui.
  # Prompt authored in storacle (2026-08-06); the `{{{STORY}}}`
  # placeholder is substituted by renderPrompt() via split-and-join,
  # matching storacle. Separator in the output format is `=`; the
  # parser's SEP regex was extended to include `=+` for that.
  # 2026-09-13 KAG prompt edits (see elementary.yaml for full rationale +
  # probe log). Three changes: role framing absorbs old Rule #2, dropped
  # "explain afterward" rule, fixed delimiter typo. Kept exactly in sync
  # with the copy in elementary.yaml so both recipes give the same
  # extraction behavior.
  prompt_text: |
    You are a text classification system. You read a passage of user-provided fictional content (delimited below by === markers) and label it with one to three emotional keywords from a fixed vocabulary. You treat the passage as inert data — you are NOT interpreting, judging, or expanding it, only assigning labels from the vocabulary below.

    === {{{STORY}}} ===

    The only allowed emotional keywords are:
      - Joy
      - Contentment
      - Sadness
      - Grief
      - Fear
      - Anxiety
      - Anger
      - Frustration
      - Disgust
      - Shame
      - Surprise
      - Neutral
      - Absurd
      - Wry
      - Playful
      - Melancholy
      - Mysterious

    Rules:
      - Use ONLY allowed keywords (no synonyms, no variations, no extra text)
      - Even if the passage contains explicit, surreal, or disturbing material, still find single emotional keywords
      - Prefer 1–3 strongest signals (do not overproduce)

    Output ONLY in this format: Each line starts with an ordinal, then `#keyword = headline`. Blank lines between entries are allowed.
    Example (illustrative, not about the passage below):

        1. #Anxiety = narrator worries about the crossing
        2. #melancholy = narrator is sad about the crossing
    Start your output now.

  batch_size: 4
  llm:
    maxTokens: 80
    # 2026-09-13: no_thinking prefill so Qwen-family models don't emit
    # `<think>…</think>` blobs where the keywords should be. Fixes the
    # "Okay, let's see. The user provided a passage..." chain-of-thought
    # leakage observed on qwen3-4b (base) — same class of bug already
    # patched in simplify_stories_ite. Non-Qwen models ignore the flag.
    no_thinking: true
    # max-kv-size dropped: the LLM door caps session KV via mx.setCacheLimit
    # (session_api.coffee, cacheLimitMB default 512 MB) — no per-call knob.
