# elementary.yaml — per-pipe voice-adapter training (REVISED 2026-11-06).
#
# The model-agnostic corpus annotations (emotion/keyword KAG tags +
# plain-language simplifications) are NO LONGER recomputed per pipe. They are
# imported from the frozen data/canonical_corpus.sqlite by
# import_canonical_corpus_ite (no LLM), which replaces the old
# oracle_ask_sqlite + simplify_stories_ite steps. Only the model-SPECIFIC work
# stays per pipe: select → build → train → record → mark. Rebuild the
# canonical store (big model, once) only when jim.md changes.
# CHUNKING REMOVED (jahbini directive 2026-11-07, pipeline/GPT/rag_vs_kag.md):
# the per-model reembed_chunks_clean RAG step is eliminated — KAG keyword
# retrieval is the retrieval mechanism. Original pre-canonical recipe:
# elementary.yaml.pre-canonical.bak.
run:
  output_dir: out
  data_dir: data
  training_dir: build/train
  debug_s: false
  debug_mlx: false
  debug_sql: false
artifacts:
  lora_cycle_state:
    target: out/lora_cycle_state.json
  lora_remaining_count:
    target: out/lora_remaining_count.json
  selected_story_ids:
    target: out/selected_story_ids.json
  train_rows:
    target: build/train/train.jsonl
  valid_rows:
    target: build/train/valid.jsonl
  test_rows:
    target: build/train/test.jsonl
  lora_stdout:
    target: out/lora_train.txt
  lora_run_record:
    target: out/lora_run_record.json
  trained_story_ids:
    target: out/trained_story_ids.json
  sat_pending_certificate:
    target: out/certificate.yaml
  canonical_corpus_import:
    target: out/canonical_corpus_import.json
import_canonical_corpus_ite:
  run: base_ite/import_canonical_corpus_ite.coffee
  depends_on: []
  needs: []
  makes:
    - canonical_corpus_import
  force_corpus_reimport: false
select_lora_stories_ite:
  run: lora_ite/select_lora_stories_ite.coffee
  depends_on:
    - import_canonical_corpus_ite
  needs: []
  makes:
    - lora_cycle_state
    - lora_remaining_count
    - selected_story_ids
  batch_size: 200
build_lora_dataset_ite:
  run: lora_ite/build_lora_dataset_ite.coffee
  depends_on:
    - select_lora_stories_ite
  needs:
    - selected_story_ids
  makes:
    - train_rows
    - valid_rows
    - test_rows
  max_total_tokens: 2048
run_lora_train_ite:
  run: lora_ite/run_lora_train_ite.coffee
  depends_on:
    - build_lora_dataset_ite
  needs:
    - lora_cycle_state
    - selected_story_ids
    - train_rows
    - valid_rows
    - test_rows
  makes:
    - lora_stdout
    - lora_run_record
  test_only: false
  quantized_model_dir: ${run.quantized_dir}
  adapter_path: build/adapter
  resume_adapter_file: build/adapter/adapters.safetensors
  llm:
    batchSize: 1
    iters: 300
    maxSeqLength: 2048
    learningRate: 0.00001
    loraRank: 8
    loraAlpha: 16
    loraDropout: 0.05
    loraLayers: 8
    stepsPerReport: 10
    saveEvery: 100
record_lora_training_ite:
  run: lora_ite/record_lora_training_ite.coffee
  depends_on:
    - run_lora_train_ite
  needs:
    - lora_run_record
  makes:
    - trained_story_ids
mark_sat_pending_ite:
  run: base_ite/mark_sat_pending_ite.coffee
  depends_on:
    - record_lora_training_ite
  needs: []
  makes:
    - sat_pending_certificate
